# 🤖 Bot Polymarket (MENSUAL) — 24/7 GRATIS con GitHub Actions
# -------------------------------------------------------------
# Opera SOLO el mercado mensual «Elon Musk # tweets in <mes> <año>?»
# (mes natural: día 1 00:00 ET → día 1 del mes siguiente 00:00 ET).
#
# ⭐ Usa GITHUB_TOKEN automático (no hace falta PAT).
# REQUISITOS: repo PÚBLICO + secrets POLY_PRIVATE_KEY,
# POLY_WALLET_ADDRESS y REAL_CONFIRMADO ("1" para operar real).
# Recomendado: repo propio (bot-polymarket-elon-mensual).

name: Bot Polymarket Elon (MENSUAL)

on:
  schedule:
    - cron: '*/15 * * * *'      # cada 15 minutos (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-mensual
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet openpyxl py-clob-client-v2

      - name: Ejecutar una pasada del bot (MODO REAL MENSUAL)
        env:
          POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
          POLY_WALLET_ADDRESS: ${{ secrets.POLY_WALLET_ADDRESS }}
          REAL_CONFIRMADO: ${{ secrets.REAL_CONFIRMADO }}
        run: python -u bot_mensual.py --modo real --excel

      - name: Guardar estado (commit de los datos)
        run: |
          git config user.name "bot-poly-mensual"
          git config user.email "bot-poly-mensual@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "estado bot mensual $(date -u +'%Y-%m-%d %H:%M')"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
